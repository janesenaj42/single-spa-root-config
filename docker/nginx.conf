server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /mfes.json {
        add_header Cache-Control "no-store";
    }

    location = /keycloak.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
