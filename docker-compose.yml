services:
  root-config:
    build: .
    ports:
      # 8080 is left free for an external Keycloak instance (e.g. your
      # existing webcore-web-keycloak container).
      - "8090:80"
    volumes:
      - ./mfes:/config/mfes:ro
    environment:
      - MFE_CONFIG_DIR=/config/mfes
      # Must be reachable from the BROWSER (not just other containers),
      # since keycloak-js runs client-side. Point this at your real Keycloak.
      - KEYCLOAK_URL=http://localhost:8080
      - KEYCLOAK_REALM=change-me
      - KEYCLOAK_CLIENT_ID=root-config
      # In Keycloak, this client needs http://localhost:8090/* in both
      # "Valid redirect URIs" and "Web origins".
    depends_on:
      - navbar-mfe
      - dashboard-mfe
      - settings-mfe

  navbar-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-mfes/navbar:/usr/share/nginx/html:ro
      - ./demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  dashboard-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-mfes/dashboard:/usr/share/nginx/html:ro
      - ./demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"

  settings-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-mfes/settings:/usr/share/nginx/html:ro
      - ./demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"
