services:
  root-config:
    build: .
    ports:
      - "8090:8080"
    volumes:
      - ./mfes:/config/mfes:ro
      # See ADR-0001: the layout shell is mounted, not baked into the
      # image, so a new in-flow region is a file edit + refresh.
      - ./public/index.html:/usr/share/nginx/html/index.html:ro
    environment:
      - MFE_CONFIG_DIR=/config/mfes
      # Must be reachable from the BROWSER (not just other containers),
      # since keycloak-js runs client-side.
      - KEYCLOAK_URL=http://localhost:8180
      - KEYCLOAK_REALM=root-config-demo
      - KEYCLOAK_CLIENT_ID=root-config
    depends_on:
      - keycloak
      - basemap-mfe
      - navbar-mfe
      - assets-mfe
      - admin-panel-mfe
      - comms-mfe

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./examples/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      # 8180, not 8080, so this doesn't collide with an unrelated Keycloak
      # you might already have running on 8080 elsewhere on this machine.
      - "8180:8080"

  basemap-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/demo-mfes/basemap:/usr/share/nginx/html:ro
      - ./examples/demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8085:80"

  navbar-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/demo-mfes/navbar:/usr/share/nginx/html:ro
      - ./examples/demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  assets-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/demo-mfes/assets:/usr/share/nginx/html:ro
      - ./examples/demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"

  admin-panel-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/demo-mfes/admin-panel:/usr/share/nginx/html:ro
      - ./examples/demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"

  comms-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/demo-mfes/comms:/usr/share/nginx/html:ro
      - ./examples/demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8084:80"
