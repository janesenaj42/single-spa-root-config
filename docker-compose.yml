services:
  root-config:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./mfes:/config/mfes:ro
    environment:
      - MFE_CONFIG_DIR=/config/mfes
    depends_on:
      - navbar-mfe
      - dashboard-mfe
      - settings-mfe

  navbar-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-mfes/navbar:/usr/share/nginx/html:ro
      - ./demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  dashboard-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-mfes/dashboard:/usr/share/nginx/html:ro
      - ./demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"

  settings-mfe:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-mfes/settings:/usr/share/nginx/html:ro
      - ./demo-mfes/cors.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"
